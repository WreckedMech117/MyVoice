[pytest]
# ---------------------------------------------------------------------------
# Story tooling-3 -- make suite hangs countable (pytest-timeout).
#
# Before this block a plain `pytest tests/` did not complete on main: several
# dialog/UI tests hang under whole-suite ordering, CPU pins and the run never
# returns (Story 20.8 AC #4 needed an external per-directory wall-clock guard
# just to produce a comparison). With pytest-timeout every test now either
# passes, fails, errors, or is named as timed out.
#
# timeout_method = thread is REQUIRED on this repo: the `signal` method relies
# on SIGALRM, which does not exist on Windows (the repo is Windows-first).
# Consequence of the thread method (pytest-timeout >= 2.x, unchanged in 2.4):
# on expiry the plugin prints "+++ Timeout +++", dumps the stack of every
# thread (the stalled test's location is in the MainThread stack), and ends
# the pytest process with os._exit(1). The run therefore TERMINATES at the
# first hang rather than stalling forever (later tests are not run); run with
# -v so the hung test's id is printed on the "+++ Timeout +++" line, then
# --deselect it and rerun to find the next one. Do NOT raise `timeout` to
# make a hang disappear; a legitimately slow test gets its own
# @pytest.mark.timeout(N) with a comment saying why.
#
# timeout = 60: derived in Story tooling-3 from the measured per-test
# distribution (setup+call+teardown -- what the plugin times by default).
# 2,875 passing tests measured 2026-09-14: max 7.63 s (Story 20.5's
# out-of-process qasync warm-up driver), p99 0.93 s, none above 10 s. 60 s is
# ~8x the slowest honest test and leaves room for a cold torch import on a
# slower ship-target host (RTX 30xx). No test needed an individual
# @pytest.mark.timeout(N). Evidence:
# _bmad-output/implementation-artifacts/tooling-3-pytest-timeout-evidence.md
# ---------------------------------------------------------------------------
timeout = 60
timeout_method = thread

# Story tooling-4: every unpatched blocking QMessageBox entry point raises
# under test instead of hanging (tests/conftest.py). Opt a single test back
# into the real Qt implementation with this marker.
markers =
    qmessagebox_passthrough: let this test reach the real (blocking) QMessageBox implementations instead of the tooling-4 raise-on-modal net
